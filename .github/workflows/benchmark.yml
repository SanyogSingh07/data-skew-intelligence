name: Skew Benchmark Workflow

on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'Number of rows to generate'
        required: false
        default: '100000'
      skew:
        description: 'Key skew concentration ratio (e.g. 0.90)'
        required: false
        default: '0.90'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Benchmark Experiment
        run: |
          python -m cli.app experiment run --rows ${{ github.event.inputs.rows }} --skew ${{ github.event.inputs.skew }} --mitigation auto
