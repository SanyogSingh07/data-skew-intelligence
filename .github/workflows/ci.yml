name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Environment Readiness Check
        run: python run.py --check

      - name: Syntax check
        run: python -m compileall .

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Pytest suite with coverage
        run: pytest -q --cov=. --cov-report=term-missing

      - name: Quick Pipeline Smoke Test & Site Export
        run: python run.py --quick --no-menu --export-site

